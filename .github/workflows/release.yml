name: Create release

on:
  push:
    branches:
      - v6.x
    paths:
      - package.json

permissions:
  contents: read

jobs:
  check-release-version:
    runs-on: ubuntu-24.04
    outputs:
      release-version: ${{ steps.set-release-version.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: set-release-version
        with:
          result-encoding: string
          script: |
            const { owner, repo } = context.repo
            const version = require("./package.json").version
            const versionTag = `v${version}`

            const { data: releases } = await github.rest.repos.listReleases({
              owner,
              repo
            })

            const previousRelease = releases.find((r) => r.tag_name.startsWith('v6'))

            if (versionTag !== previousRelease?.tag_name) {
              return versionTag
            }

  release:
    runs-on: ubuntu-24.04
    needs: check-release-version
    if: ${{ github.ref_name == 'v6.x' && startsWith(needs.check-release-version.outputs.release-version, 'v') }}

    permissions:
      contents: write
      id-token: write

    environment: release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@11
      - run: npm install
      - name: Create NPM release
        run: npm publish --provenance --access public --tag six
      - run: node scripts/generate-undici-types-package-json.js
      - run: npm publish --provenance --tag six
        working-directory: './types'
      - name: Create GitHub release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const releaseBranch = "${{ github.ref_name }}"
            const versionTag = "${{ needs.check-release-version.outputs.release-version }}"
            await require('./scripts/release').release({ github, context, releaseBranch, versionTag })
